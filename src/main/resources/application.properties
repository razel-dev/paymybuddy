spring.application.name=paymybuddy

# --- Datasource MySQL (local) ---
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/paymybuddy?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:paymybuddy}
spring.datasource.password=${DB_PASSWORD:paymybuddy}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway (schema migrations) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Problem Details
spring.mvc.problemdetails.enabled=true

# Error response policy
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.include-stacktrace=never

# Springdoc
# Swagger UI: http://localhost:8080/swagger-ui/index.html
# OpenAPI: http://localhost:8080/v3/api-docs.yaml

# --- Security ---
security.hsts.enabled=false
security.rate.max-requests=100
security.rate.window-seconds=60

# --- Business limits ---
limits.transfer.max-amount=1000.00

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
