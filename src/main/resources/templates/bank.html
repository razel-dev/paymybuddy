<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::body}, 'Virement bancaire', true, true, true)}">


<body>

<!-- FORMULAIRE : DÉPÔT / RETRAIT -->
<section class="container my-4">
    <div class="card mb-4">
        <div class="card-header">
            <h2>Virement bancaire (dépôt / retrait)</h2>
        </div>

        <div class="card-body">
            <form th:action="@{/bank}" th:object="${bankForm}" method="post" class="row g-3">

                <!-- Compte -->
                <div class="col-md-6">
                    <label for="account" class="form-label">Compte</label>
                    <select id="account" class="form-select" th:field="*{accountId}" required>
                        <option th:each="a : ${accounts}"
                                th:value="${a.id}"
                                th:text="${a.accountName + ' (' + a.currency + ')'}">Compte</option>
                    </select>
                </div>

                <!-- Type -->
                <div class="col-md-6">
                    <label for="type" class="form-label">Type</label>
                    <select id="type" class="form-select" th:field="*{type}" required>
                        <option th:value="DEPOSIT">Dépôt</option>
                        <option th:value="WITHDRAWAL">Retrait</option>
                    </select>
                </div>

                <!-- Montant -->
                <div class="col-md-6">
                    <label for="amount" class="form-label">Montant</label>
                    <input id="amount"
                           class="form-control"
                           th:field="*{amount}"
                           placeholder="0,00"
                           required>
                </div>

                <!-- Bouton -->
                <div class="col-12">
                    <button id="exec" type="submit" class="btn btn-primary">
                        Exécuter
                    </button>
                </div>

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            </form>
        </div>
    </div>
</section>


<!-- HISTORIQUE DES OPÉRATIONS BANCAIRES -->
<section class="container mb-4">
    <div class="card">
        <div class="card-header">
            <h2>Historique</h2>
        </div>

        <div class="card-body">
            <p class="text-muted" th:if="${#lists.isEmpty(history)}">
                Aucune opération bancaire pour le moment.
            </p>

            <table class="table" th:if="${!#lists.isEmpty(history)}">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th class="text-end">Montant</th>
                    <th>Compte</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="t : ${history}">
                    <td th:text="${#temporals.format(t.createdAt, 'dd/MM/yy HH:mm')}">-</td>
                    <td th:text="${t.type}">DEPOSIT</td>

                    <td class="text-end"
                        th:text="${#numbers.formatDecimal(t.amount, 1, 'POINT', 2, 'POINT')}">
                        0.00
                    </td>

                    <td th:text="${t.accountId}">-</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>

</body>
</html>
