<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::body}, 'Tableau de bord')}">
<head>
    <meta charset="UTF-8">
    <title>Tableau de bord</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<section class="container my-4">
    <div class="card mb-4">
        <div class="card-header">
            <h2>Mes comptes</h2>
        </div>
        <div class="card-body">
            <ul class="list-group">
                <li th:each="a : ${accounts}" class="list-group-item d-flex justify-content-between align-items-center">
                        <span>
                            <span th:text="${a.accountName}">Compte</span> — <span th:text="${a.currency}">EUR</span>
                        </span>
                    <span class="badge bg-primary rounded-pill">
                            <strong th:text="${#numbers.formatDecimal(a.balance, 1, 'POINT', 2, 'POINT')}">0.00</strong>
                        </span>
                </li>
            </ul>
        </div>
    </div>
</section>
</body>
</html>
