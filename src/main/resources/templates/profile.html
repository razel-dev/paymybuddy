<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::body}, 'Profil', true, true, true,'')}">

<body>
<section class="container">
    <div class="card">
        <div class="card-header">
            <h2>Profil</h2>
        </div>
        <div class="card-body">
            <div class="settings">
                <div class="row">
                    <div class="col-4">Username</div>
                    <div class="col" th:text="${user.username}">@username</div>
                </div>
                <div class="row">
                    <div class="col-4">Mail</div>
                    <div class="col" th:text="${user.email}">nom@domain.com</div>
                </div>
                <div class="row">
                    <div class="col-4">Mot de passe</div>
                    <div class="col">••••••••</div>
                </div>
            </div>
            <div class="mt-3">
                <a th:href="@{/profile/edit}" class="btn btn-warning">Modifier</a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
