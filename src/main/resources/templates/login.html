<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section}, 'Se connecter - PayMyBuddy', false, false, true, 'bg-success bg-opacity-25 text-dark')}">
<section>
  <main class="container d-flex justify-content-center align-items-center min-vh-100">
    <section class="card p-4 text-center" style="max-width: 300px; width: 100%;">
      <button class="btn btn-warning mb-3">Pay My Buddy</button>

      <!-- messages -->
      <div th:if="${param.error}" class="alert alert-danger mb-3">
        Identifiants invalides. Veuillez réessayer.
      </div>

      <div th:if="${param.logout}" class="alert alert-info mb-3">
        Vous avez été déconnecté.
      </div>

      <!-- Formulaire Spring Security -->
      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <input type="email" class="form-control" id="email" name="username"
                 placeholder="Mail" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <input type="password" class="form-control" id="password" name="password"
                 placeholder="Mot de passe" autocomplete="current-password" required>
        </div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <button type="submit" class="btn btn-primary w-100">Se connecter</button>

        <div class="mt-3">
          <a class="btn btn-secondary w-100" th:href="@{/register}">S'inscrire</a>
        </div>
      </form>
    </section>
  </main>
</section>
</html>
