<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::body}, 'Comptes')}">
<body>

<section class="section">
    <div class="card">
        <div class="card-header">
            <h2>Créer un compte</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/accounts}" th:object="${accountForm}" method="post" class="form-grid">
                <div class="form-row">
                    <label for="accountName" class="form-label">Nom du compte</label>
                    <input id="accountName" th:field="*{accountName}" class="input" placeholder="Ex: Compte principal" required>
                </div>

                <div class="form-row">
                    <label for="currency" class="form-label">Devise (ISO 4217)</label>
                    <input id="currency" th:field="*{currency}" class="input" placeholder="EUR" required>
                    <small class="muted">Ex: EUR</small>
                </div>

                <input type="hidden" th:field="*{userId}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Créer</button>
                </div>
            </form>
        </div>
    </div>
</section>

<section class="section">
    <div class="card table-card">
        <div class="card-header">
            <h2>Mes comptes</h2>
        </div>
        <div class="card-body">
            <p class="muted" th:if="${#lists.isEmpty(accounts)}">Aucun compte pour le moment.</p>
            <table class="table" th:if="${!#lists.isEmpty(accounts)}">
                <thead>
                <tr>
                    <th>Nom</th>
                    <th>Devise</th>
                    <th class="num">Solde</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${accounts}">
                    <td th:text="${a.accountName}">Compte principal</td>
                    <td th:text="${a.currency}">EUR</td>
                    <td class="num" th:text="${#numbers.formatDecimal(a.balance, 1, 'POINT', 2, 'POINT')}">0.00</td>
                    <td>
                        <form th:action="@{|/accounts/${a.id}|}" method="post" th:object="${a}" style="display:inline">
                            <input type="hidden" name="_method" value="delete"/>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-danger">Supprimer</button>
                        </form>

                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>

</body>
</html>
