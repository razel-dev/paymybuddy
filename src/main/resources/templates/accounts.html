<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::body}, 'Comptes')}">
<head>
    <meta charset="UTF-8">
    <title>Comptes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<section class="container my-4">
    <div class="card mb-4">
        <div class="card-header">
            <h2>Créer un compte</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/accounts}" th:object="${accountForm}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label for="accountName" class="form-label">Nom du compte</label>
                    <input id="accountName" th:field="*{accountName}" class="form-control" placeholder="Ex: Compte principal" required>
                </div>
                <div class="col-md-6">
                    <label for="currency" class="form-label">Devise (ISO 4217)</label>
                    <input id="currency" th:field="*{currency}" class="form-control" placeholder="EUR" required>
                    <small class="form-text text-muted">Ex: EUR</small>
                </div>
                <input type="hidden" th:field="*{userId}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Créer</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>Mes comptes</h2>
        </div>
        <div class="card-body">
            <p class="text-muted" th:if="${#lists.isEmpty(accounts)}">Aucun compte pour le moment.</p>
            <table class="table" th:if="${!#lists.isEmpty(accounts)}">
                <thead>
                <tr>
                    <th>Nom</th>
                    <th>Devise</th>
                    <th class="text-end">Solde</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${accounts}">
                    <td th:text="${a.accountName}">Compte principal</td>
                    <td th:text="${a.currency}">EUR</td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(a.balance, 1, 'POINT', 2, 'POINT')}">0.00</td>
                    <td>
                        <form th:action="@{|/accounts/${a.id}|}" method="post" style="display:inline">
                            <input type="hidden" name="_method" value="delete"/>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-danger btn-sm">Supprimer</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
