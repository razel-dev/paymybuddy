<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::body}, 'Transfert')}">
<head>
    <meta charset="UTF-8">
    <title>Transfert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<section class="container my-4">
    <div class="card mb-4">
        <div class="card-header">
            <h2>Transfert entre comptes</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/transfer}" th:object="${transferForm}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label for="sender" class="form-label">Compte émetteur</label>
                    <select id="sender" class="form-select" th:field="*{senderAccountId}" required>
                        <option th:each="a : ${accounts}" th:value="${a.id}"
                                th:text="${a.accountName + ' (' + a.currency + ')'}">Compte</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="receiver" class="form-label">Destinataire (email)</label>
                    <input id="receiver" class="form-control" th:field="*{receiverEmail}" type="email" placeholder="ex. user@example.com" required>
                </div>
                <div class="col-md-6">
                    <label for="amount" class="form-label">Montant</label>
                    <input id="amount" class="form-control" th:field="*{amount}" placeholder="0,00" required>
                </div>
                <div class="col-md-6">
                    <label for="desc" class="form-label">Description</label>
                    <input id="desc" class="form-control" th:field="*{description}" placeholder="Description">
                </div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Payer</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h2>Historique récent</h2>
        </div>
        <div class="card-body">
            <p class="text-muted" th:if="${#lists.isEmpty(history)}">Aucune transaction pour le moment.</p>
            <table class="table" th:if="${!#lists.isEmpty(history)}">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Vers</th>
                    <th class="text-end">Montant</th>
                    <th class="text-end">Frais</th>
                    <th>Description</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${history}">
                    <td th:text="${#temporals.format(t.createdAt, 'dd/MM/yy HH:mm')}">-</td>
                    <td th:text="${t.receiverEmail}">-</td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(t.amount, 1, 'POINT', 2, 'POINT')}">-</td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(t.fee, 1, 'POINT', 2, 'POINT')}">-</td>
                    <td th:text="${t.description}">-</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
