services:
  mysql:
    image: mysql:8.4
    container_name: paymybuddy-mysql
    environment:
      MYSQL_DATABASE: paymybuddy
      MYSQL_USER: paymybuddy
      MYSQL_PASSWORD: paymybuddy
      MYSQL_ROOT_PASSWORD: rootroot
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paymybuddy-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/paymybuddy?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: paymybuddy
      DB_PASSWORD: paymybuddy
    ports:
      - "8080:8080"

volumes:
  mysql-data:
